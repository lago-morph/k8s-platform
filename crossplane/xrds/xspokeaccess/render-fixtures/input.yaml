# Probe XSpokeAccess used by `crossplane render` for the SPEC-S9 dry-run
# (auto-008 C6, extended for ADR-0010 PR-2).
#
# The account-ephemeral inputs (accountId, the ${clusterName}-argocd role
# ARN, the Route53 zone id, the domain) are supplied by the
# cluster-network EnvironmentConfig in required-resources.yaml (NOT on the
# XR).
#
# The status block carries deterministic PROBE values for the fields the
# cluster-facts Observe Object mirrors at runtime (plus the
# externalDnsRoleArn echoed from the Role MR). `crossplane render`
# resolves FromCompositeFieldPath against the input XR INCLUDING status,
# so populating it here renders the COMPLETE registration Secret into the
# golden — exercising every Required-policy patch (the
# complete-or-absent guarantee). These are stub values (account
# 000000000000), NOT real account-ephemeral data (AGENTS §8.1).
#
# metadata.uid is pinned for deterministic render output (SPEC-S9 §5).
# The render is fully offline; no real AWS resources are queried.
apiVersion: platform.k8-platform.io/v1alpha1
kind: XSpokeAccess
metadata:
  name: render-probe-spoke
  namespace: default
  uid: "00000000-0000-0000-0000-000000000003"
spec:
  clusterName: render-probe
  subdomain: platform
  shortName: spoke
  region: us-east-1
status:
  clusterOidcIssuer: https://oidc.eks.us-east-1.amazonaws.com/id/RENDERPROBE00000000000000000000
  clusterEndpoint: https://RENDERPROBE0000000000000000000000.gr7.us-east-1.eks.amazonaws.com
  clusterCaData: UkVOREVSLVBST0JFLUNBLURBVEE=
  clusterCertificateArn: arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
  externalDnsRoleArn: arn:aws:iam::000000000000:role/k8-platform-render-probe-external-dns
  esoRoleArn: arn:aws:iam::000000000000:role/k8-platform-render-probe-eso
  ebsCsiRoleArn: arn:aws:iam::000000000000:role/k8-platform-render-probe-ebs-csi
