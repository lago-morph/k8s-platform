# XSpokeAccess — the spoke cluster's hub→spoke GitOps access anchor
# (auto-008 Round 2 §3 + 2nd-wave C1–C6).
#
# A separate XR + Composition from XPlatformCluster ON PURPOSE (auto-008
# C2): patch-and-transform has no conditional gating, so cramming the
# spoke-access MRs into the cluster Composition would patch
# `url: ""` from an empty status.oidcIssuer and hard-fail before the
# cluster is Ready. Instead this XR consumes the cluster's *published*
# status — since ADR-0010 PR-2 via the cluster-facts Observe Object (no
# operator overlay) — and is gated on the cluster being Ready via ArgoCD
# sync-wave (the XR's Application is wave 20, after the cluster claim at
# wave 10, and is manual-sync — see
# clusters/platform/spoke-access.yaml + argocd/apps/spoke-access.yaml).
#
# A claim against this XRD renders, on the HUB Crossplane:
#   1. OpenIDConnectProvider for the spoke's OIDC issuer (the IRSA anchor
#      the cluster Composition deliberately omits — platform-cluster XRD
#      header). thumbprintList is the well-known Amazon root constant
#      (auto-008 C1 — a published constant, NOT account-ephemeral).
#   2. external-dns IAM Role (IRSA trust to the spoke OIDC +
#      external-dns:external-dns SA) + an INLINE RolePolicy (auto-008 C4 —
#      the crossplane IRSA has iam:PutRolePolicy, not iam:CreatePolicy)
#      scoped to the cluster's Route53 zone.
#   3. EKS AccessEntry + AccessPolicyAssociation mapping the management
#      cluster's ${clusterName}-argocd IAM role to
#      AmazonEKSClusterAdminPolicy on the SPOKE cluster, so the ArgoCD
#      application-controller can sync to it (auto-008 §3 / reviewer F5).
#
# Account-ephemeral inputs (account id, the ${clusterName}-argocd role
# ARN, the Route53 zone id, the root domain) are NOT carried on this XR
# (AGENTS §8.1). They are injected from the `cluster-network`
# EnvironmentConfig that terraform/management materializes (extended in
# terraform/management/crossplane-phase3.tf — auto-008 C3/C5). The XR
# carries only stable per-spoke values.
#
# ADR-0010 PR-2 (OI-2026-06-07-1) adds the producer half of the
# cluster-facts contract:
#   4. A cluster-facts OBSERVE Object (provider-kubernetes, hub
#      ProviderConfig) reading the paired XPlatformCluster XR — the one
#      with this XR's OWN metadata.name/namespace (pairing asserted by
#      tests/unit/test_xspokeaccess.sh). Its status supplies the OIDC
#      issuer, endpoint, CA data and certificate ARN to this XR's status.
#      This REVERSES the auto-008 C2 spec.oidcIssuer overlay input: the
#      issuer is observed, never hand-patched (SUBSTRATE-READINESS bans
#      placeholder overlays). C2's ordering concern is still honored by
#      the manual-sync Application gate + the Observe readiness check.
#   5. The ArgoCD spoke registration Secret (provider-kubernetes Object,
#      complete-or-absent via Required-policy patches) carrying the
#      ADR-0010 five-fact contract as k8-platform.io/* annotations and
#      the selector labels. Registration name = <subdomain>-spoke
#      (matches the platform-spoke AppProject destination allowlist).
#
# WARNING: when this XR is synced, Crossplane creates REAL AWS resources
# (an OIDC provider, an IAM role/policy, and EKS access entries) and
# registers the spoke with the hub ArgoCD. The corresponding ArgoCD
# Application is manual-sync only.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xspokeaccesses.platform.k8-platform.io
  annotations:
    # XRDs land before Compositions (wave -1) so the Composition's
    # compositeTypeRef binds against an already-Established XRD. Mirrors
    # the platform-cluster / xdatabase XRD wave.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  group: platform.k8-platform.io
  # v2 namespaced XR — applied directly into the `platform` namespace
  # alongside the XPlatformCluster XR. No separate claim type; mirrors
  # XPlatformCluster / XDatabase / XPlatformSecret.
  scope: Namespaced
  names:
    kind: XSpokeAccess
    plural: xspokeaccesses
    listKind: XSpokeAccessList
    singular: xspokeaccess
  defaultCompositionRef:
    name: xspokeaccess-aws
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                clusterName:
                  type: string
                  description: >-
                    The SPOKE EKS cluster name (e.g. k8-platform-services).
                    Targets the AccessEntry/AccessPolicyAssociation at the
                    spoke cluster. Matches XPlatformCluster.spec.name.
                  pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
                subdomain:
                  type: string
                  description: >-
                    DNS label for this spoke under the root domain (e.g.
                    "platform" → platform.<domain>). external-dns on the
                    spoke is scoped to this subdomain; the inline Route53
                    policy is zone-scoped (the whole hosted zone, shared by
                    hub + spokes — record-level scoping is via external-dns
                    --domain-filter, auto-008 §6).
                  pattern: "^[a-z][a-z0-9-]{0,30}[a-z0-9]$"
                shortName:
                  type: string
                  description: >-
                    The ADR-0010 short-name selector value for this spoke
                    (e.g. "spoke", "workload1"). Stamped on the registration
                    Secret as the k8-platform.io/short-name label; the
                    consumer ApplicationSets derive generated Application
                    names and per-cluster values files from it. Stable and
                    committed (not account-ephemeral).
                  pattern: "^[a-z][a-z0-9-]{0,30}[a-z0-9]$"
                region:
                  type: string
                  description: >-
                    AWS region for the EKS AccessEntry/AccessPolicyAssociation
                    MRs. Defaults to us-east-1 — match the spoke cluster's
                    region.
                  pattern: "^[a-z]{2}-[a-z]+-[0-9]$"
                  default: "us-east-1"
              required:
                - clusterName
                - subdomain
                - shortName
            status:
              type: object
              properties:
                oidcProviderArn:
                  type: string
                  description: >-
                    ARN of the created OpenIDConnectProvider, echoed for
                    observability.
                externalDnsRoleArn:
                  type: string
                  description: >-
                    ARN of the external-dns IRSA Role, echoed for
                    observability (referenced by the spoke external-dns
                    ServiceAccount annotation at registration time).
                esoRoleArn:
                  type: string
                  description: >-
                    ARN of the external-secrets (ESO) IRSA Role, stamped as
                    the k8-platform.io/eso-role-arn contract annotation so
                    the spoke ESO ServiceAccount can assume it (ADR-0005
                    ESO-baseline corollary; ADR-0010 contract amendment).
                accessEntryArn:
                  type: string
                  description: >-
                    ARN of the EKS AccessEntry mapping the argocd role to
                    the spoke, echoed for observability.
                ebsCsiRoleArn:
                  type: string
                  description: >-
                    ARN of the aws-ebs-csi-driver IRSA Role, consumed by the
                    EBS CSI Addon's serviceAccountRoleArn so the driver can
                    call CreateVolume/AttachVolume (kp-2al.4 /
                    OI-2026-06-11-3). Cross-resource refs travel via the
                    composite, so it is a status field, not a contract
                    annotation — no spoke workload reads it.
                # ---- cluster-facts mirrors (ADR-0010 PR-2) -------------
                # Populated by the cluster-facts Observe Object from the
                # paired XPlatformCluster's status; consumed by the
                # spoke-cluster-secret Object's patches (P&T cross-resource
                # refs travel via the composite). All four are
                # account-ephemeral at runtime and never committed.
                clusterOidcIssuer:
                  type: string
                  description: >-
                    Observed XPlatformCluster.status.oidcIssuer. Feeds the
                    OpenIDConnectProvider url and the external-dns trust
                    policy conditions (replaces the retired spec.oidcIssuer
                    overlay).
                clusterEndpoint:
                  type: string
                  description: >-
                    Observed XPlatformCluster.status.endpoint — the spoke
                    API server URL, written to the registration Secret's
                    `server` field.
                clusterCaData:
                  type: string
                  description: >-
                    Observed XPlatformCluster.status.clusterCaData (base64
                    cluster CA, public material) — embedded in the
                    registration Secret's config JSON
                    (tlsClientConfig.caData).
                clusterCertificateArn:
                  type: string
                  description: >-
                    Observed XPlatformCluster.status.certificateArn — the
                    spoke's wildcard ACM cert, stamped as the
                    k8-platform.io/certificate-arn contract annotation.
