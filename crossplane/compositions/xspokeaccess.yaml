# XSpokeAccess → spoke hub-access Composition (auto-008 Round 2 §3 + C1–C6).
#
# Crossplane v2 Pipeline mode (function-environment-configs THEN
# function-patch-and-transform), matching the platform-cluster
# Composition shape. Renders, on the HUB Crossplane, the AWS trust + IRSA
# + EKS-access resources a spoke needs to receive its add-on stack via
# ArgoCD from the hub:
#
#   1. OpenIDConnectProvider — the spoke's IRSA anchor (the cluster
#      Composition deliberately omits it; platform-cluster XRD header).
#      url = spec.oidcIssuer; thumbprintList is the well-known Amazon root
#      thumbprint (auto-008 C1 — a published constant, NOT account-
#      ephemeral, so it is safe committed); clientIdList = sts.amazonaws.com.
#   2. external-dns IAM Role + INLINE RolePolicy (auto-008 C4 — the
#      crossplane IRSA has iam:PutRolePolicy, NOT iam:CreatePolicy, so an
#      inline RolePolicy MR rather than a managed Policy MR). The trust
#      policy uses StringEquals on BOTH <oidc>:sub = system:serviceaccount:
#      external-dns:external-dns AND <oidc>:aud = sts.amazonaws.com
#      (auto-008 S2 — never StringLike). The Route53-zone-scoped inline
#      policy + the OIDC provider ARN in the trust policy are built from
#      the cluster-network EnvironmentConfig (accountId, route53ZoneId) +
#      spec.oidcIssuer via patches, NOT literals (AGENTS §8.1).
#   2b. external-secrets (ESO) IAM Role + INLINE RolePolicy — same trust
#      shape, :sub = system:serviceaccount:external-secrets:external-secrets;
#      ASM read scoped to k8-platform/* in this account+region (ADR-0005
#      ESO-baseline; ARN rides the contract as k8-platform.io/eso-role-arn).
#   2c. aws-ebs-csi-driver IAM Role + AWS-MANAGED policy attachment
#      (AmazonEBSCSIDriverPolicy, so a RolePolicyAttachment rather than an
#      inline RolePolicy — there is no custom document to author) + the
#      managed EKS Addon itself, wired serviceAccountRoleArn := that Role.
#      Same trust shape; :sub = system:serviceaccount:kube-system:
#      ebs-csi-controller-sa (the SA the addon creates, not ours to name).
#      kp-2al.4 / OI-2026-06-11-3: without the driver AND without a default
#      StorageClass (delivered by argocd/apps/spoke/storage.yaml) every
#      spoke observability PVC stays Pending forever.
#   3. EKS AccessEntry + AccessPolicyAssociation (auto-008 C3) mapping the
#      management cluster's ${clusterName}-argocd IAM role (the FULL ARN
#      from the EnvironmentConfig) to AmazonEKSClusterAdminPolicy on the
#      SPOKE cluster, so the ArgoCD application-controller can sync to it.
#      accessScope.type: cluster.
#   4. cluster-facts OBSERVE Object (ADR-0010 PR-2): provider-kubernetes
#      reads the paired XPlatformCluster XR (this XR's OWN name/namespace
#      — no free-text target to typo; a broken pairing is observe-not-
#      found = Synced=False, loud) and mirrors its status facts
#      (oidcIssuer, endpoint, caData, certificateArn) onto this XR's
#      status. Replaces the retired spec.oidcIssuer operator overlay.
#   5. spoke-cluster-secret Object (ADR-0010 PR-2 / OI-2026-06-07-1):
#      the durable ArgoCD registration Secret in the argocd namespace,
#      carrying the six-fact contract annotations + selector labels the
#      consumer ApplicationSets template. COMPLETE-OR-ABSENT: every patch
#      into the Secret manifest carries policy.fromFieldPath: Required —
#      under function-patch-and-transform v0.10.6 a Required patch that
#      cannot resolve skips creating THIS composed resource only (the
#      siblings proceed), so the Secret is never written partially
#      (ADR-0010 consequence (b)). Registration name = <subdomain>-spoke,
#      matching the platform-spoke AppProject destination allowlist
#      (platform-spoke / *-spoke). The hub app-controller authenticates
#      via awsAuthConfig.clusterName = spec.clusterName — the same value
#      the AccessEntry (3) grants on, so a wrong-cluster fact read cannot
#      authenticate (fail-closed at auth).
#
# All three ARNs are published to the XR status for observability.
#
# The OIDC host-path (issuer URL minus the https:// scheme) is needed in
# three places: the OIDC provider ARN in the trust policy's Federated
# principal, and the two condition keys (<host>:sub, <host>:aud). It is
# derived once into the pipeline environment via a top-level environment
# patch with a TrimPrefix string transform, then assembled into the
# policy JSON with CombineFromEnvironment (per-resource ToEnvironment
# writes are NOT visible to a combine in the same pass; top-level
# environment patches are — same idiom the platform-cluster Composition
# uses for `subdomain`). Since ADR-0010 PR-2 the issuer source is
# status.clusterOidcIssuer (the Observe Object's mirror), which lands on
# the observed composite one reconcile after observation — the
# established "cross-resource refs travel via the composite" idiom. The
# issuer-dependent patches are Required, so the OIDC provider and the
# external-dns Role are simply not created until the issuer is observed
# (no url:"" hard-fail — the auto-008 C2 concern this XR exists for).
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xspokeaccess-aws
  labels:
    platform.k8-platform.io/abstraction: XSpokeAccess
    platform.k8-platform.io/backend: aws
  annotations:
    # Wave 0 — lands AFTER the v2 XRD (wave -1) so the compositeTypeRef
    # binds against the Established XRD. Mirrors platform-cluster.
    argocd.argoproj.io/sync-wave: "0"
spec:
  compositeTypeRef:
    apiVersion: platform.k8-platform.io/v1alpha1
    kind: XSpokeAccess
  mode: Pipeline
  pipeline:
    # ---------- step 0: load account-ephemeral env values ----------------
    # function-environment-configs merges the `cluster-network`
    # EnvironmentConfig into the pipeline environment. That config is
    # materialized by terraform/management (crossplane-phase3.tf, extended
    # for auto-008 C3) and carries accountId, argocdRoleArn, route53ZoneId
    # and domain — read below via FromEnvironmentFieldPath /
    # CombineFromEnvironment so the XR in git carries no account-ephemeral
    # identifiers (AGENTS §8.1).
    - step: load-environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          environmentConfigs:
            - type: Reference
              ref:
                name: cluster-network
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        # Top-level environment patches run BEFORE resource patches, so the
        # OIDC issuer (raw) and the OIDC host-path (issuer minus https://)
        # land in the pipeline environment in time for the
        # CombineFromEnvironment policy-document assembly below.
        environment:
          patches:
            # Issuer source = the cluster-facts Observe Object's status
            # mirror (ADR-0010 PR-2). Before it populates these patches
            # skip (Optional default) and the issuer-dependent resource
            # patches below (Required) hold those MRs back — never an
            # empty url.
            - type: FromCompositeFieldPath
              fromFieldPath: status.clusterOidcIssuer
              toFieldPath: oidcIssuer
            - type: FromCompositeFieldPath
              fromFieldPath: status.clusterOidcIssuer
              toFieldPath: oidcHost
              transforms:
                - type: string
                  string:
                    type: TrimPrefix
                    trim: "https://"
            # spec.region → environment so the ESO inline-policy combine can
            # pin the ASM ARN to <region>+<accountId> (a combine reads ONE
            # source — composite values must travel via the environment to
            # join accountId, the same idiom as oidcHost above).
            - type: FromCompositeFieldPath
              fromFieldPath: spec.region
              toFieldPath: region
        resources:

          # ---------- 0. cluster-facts Observe Object ----------------
          # provider-kubernetes (hub ClusterProviderConfig, InjectedIdentity)
          # observes the PAIRED XPlatformCluster — the one with this XR's
          # own metadata.name/namespace (pairing asserted by
          # tests/unit/test_xspokeaccess.sh; a broken pairing is
          # observe-not-found = Synced=False, loud, never a wrong-cluster
          # read). Mirrors the cluster's published facts onto this XR's
          # status for the registration Secret + the OIDC trust plane.
          # Readiness requires ALL FOUR facts observed, so "target exists
          # but facts never populate" (cluster not Ready, RBAC gap) holds
          # this Object — and the XR — visibly Ready=False instead of
          # silently never registering the spoke (ADR-0010 PR-2 brief,
          # loudness guard).
          - name: cluster-facts
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-cluster-facts
              spec:
                managementPolicies: [Observe]
                forProvider:
                  manifest:
                    apiVersion: platform.k8-platform.io/v1alpha1
                    kind: XPlatformCluster
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: hub
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.namespace
                toFieldPath: spec.forProvider.manifest.metadata.namespace
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.manifest.status.oidcIssuer
                toFieldPath: status.clusterOidcIssuer
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.manifest.status.endpoint
                toFieldPath: status.clusterEndpoint
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.manifest.status.clusterCaData
                toFieldPath: status.clusterCaData
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.manifest.status.certificateArn
                toFieldPath: status.clusterCertificateArn
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.manifest.status.oidcIssuer
              - type: NonEmpty
                fieldPath: status.atProvider.manifest.status.endpoint
              - type: NonEmpty
                fieldPath: status.atProvider.manifest.status.clusterCaData
              - type: NonEmpty
                fieldPath: status.atProvider.manifest.status.certificateArn

          # ---------- 1. OpenIDConnectProvider ----------------------
          # The spoke's IRSA anchor. thumbprintList is the well-known
          # Amazon root CA thumbprint (auto-008 C1) — a published
          # constant, not account-ephemeral, so committing it is fine.
          - name: oidc-provider
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: OpenIDConnectProvider
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-oidc-provider
              spec:
                forProvider:
                  clientIdList:
                    - sts.amazonaws.com
                  thumbprintList:
                    - 9e99a48a9960b14926bb7f3b02e22da2b0ab7280
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: XSpokeAccess
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              # Required: the OIDC provider is not created until the issuer
              # is observed from the paired cluster XR (never url:"").
              - type: FromCompositeFieldPath
                fromFieldPath: status.clusterOidcIssuer
                toFieldPath: spec.forProvider.url
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.tags.ClusterName
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.oidcProviderArn
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 2. external-dns IRSA Role ---------------------
          # Trust policy: StringEquals on BOTH <oidc>:sub and <oidc>:aud
          # (auto-008 S2 — never StringLike). The Federated principal ARN
          # and the condition keys are assembled from the environment
          # (accountId + oidcHost) via CombineFromEnvironment.
          - name: external-dns-role
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-external-dns-role
              spec:
                forProvider:
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: XSpokeAccess
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-%s-external-dns"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.tags.ClusterName
              # Build the IRSA trust policy from the environment. Variables:
              #   [accountId, oidcHost, oidcHost, oidcHost]
              #   → arn:aws:iam::<accountId>:oidc-provider/<oidcHost>
              #     + StringEquals { "<oidcHost>:sub": ".../external-dns",
              #                      "<oidcHost>:aud": "sts.amazonaws.com" }
              - type: CombineFromEnvironment
                # Required: the Role is not created until oidcHost reaches
                # the environment (i.e. the issuer was observed) — an IAM
                # Role must never be created with an empty trust policy.
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: accountId
                    - fromFieldPath: oidcHost
                    - fromFieldPath: oidcHost
                    - fromFieldPath: oidcHost
                  strategy: string
                  string:
                    fmt: |
                      {
                        "Version": "2012-10-17",
                        "Statement": [{
                          "Effect": "Allow",
                          "Principal": {"Federated": "arn:aws:iam::%s:oidc-provider/%s"},
                          "Action": "sts:AssumeRoleWithWebIdentity",
                          "Condition": {"StringEquals": {
                            "%s:sub": "system:serviceaccount:external-dns:external-dns",
                            "%s:aud": "sts.amazonaws.com"
                          }}
                        }]
                      }
                toFieldPath: spec.forProvider.assumeRolePolicy
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.externalDnsRoleArn
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 3. external-dns inline RolePolicy -------------
          # Inline (auto-008 C4): the crossplane IRSA has iam:PutRolePolicy
          # but NOT iam:CreatePolicy. role references the Role (2) by its
          # deterministic external-name (same Format as above). The policy
          # is scoped to the cluster's Route53 hosted zone (from the
          # cluster-network EnvironmentConfig route53ZoneId).
          - name: external-dns-policy
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicy
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-external-dns-policy
              spec:
                forProvider: {}
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-external-dns"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-%s-external-dns"
              # Route53 record-write scoped to the hosted zone; list/get is
              # global by API shape (mirrors the hub route53_editor policy
              # in terraform/management/irsa.tf).
              - type: CombineFromEnvironment
                combine:
                  variables:
                    - fromFieldPath: route53ZoneId
                  strategy: string
                  string:
                    fmt: |
                      {
                        "Version": "2012-10-17",
                        "Statement": [
                          {
                            "Effect": "Allow",
                            "Action": ["route53:ChangeResourceRecordSets"],
                            "Resource": "arn:aws:route53:::hostedzone/%s"
                          },
                          {
                            "Effect": "Allow",
                            "Action": [
                              "route53:ListResourceRecordSets",
                              "route53:ListHostedZones",
                              "route53:ListHostedZonesByName",
                              "route53:ListTagsForResource"
                            ],
                            "Resource": "*"
                          },
                          {
                            "Effect": "Allow",
                            "Action": ["route53:GetChange"],
                            "Resource": "arn:aws:route53:::change/*"
                          }
                        ]
                      }
                toFieldPath: spec.forProvider.policy

          # ---------- 3b. external-secrets (ESO) IRSA Role -----------
          # ADR-0005 ESO-baseline corollary: every spoke runs ESO with an
          # IRSA-backed ClusterSecretStore so committed ExternalSecrets can
          # pull ASM material (first consumer: the keycloak-db connection
          # secret, OI-2026-06-07-5). Same trust shape as external-dns
          # (StringEquals on BOTH :sub and :aud — auto-008 S2); :sub pins
          # the ESO chart's pinned SA external-secrets/external-secrets.
          # ARN → status.esoRoleArn → the k8-platform.io/eso-role-arn
          # contract annotation (ADR-0010 amendment) the spoke `eso`
          # ApplicationSet templates into the chart's SA annotation.
          - name: eso-role
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-eso-role
              spec:
                forProvider:
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: XSpokeAccess
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-%s-eso"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.tags.ClusterName
              # IRSA trust policy from the environment, exactly like the
              # external-dns Role above. Required: never create an IAM Role
              # with an empty trust policy — wait for the observed issuer.
              - type: CombineFromEnvironment
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: accountId
                    - fromFieldPath: oidcHost
                    - fromFieldPath: oidcHost
                    - fromFieldPath: oidcHost
                  strategy: string
                  string:
                    fmt: |
                      {
                        "Version": "2012-10-17",
                        "Statement": [{
                          "Effect": "Allow",
                          "Principal": {"Federated": "arn:aws:iam::%s:oidc-provider/%s"},
                          "Action": "sts:AssumeRoleWithWebIdentity",
                          "Condition": {"StringEquals": {
                            "%s:sub": "system:serviceaccount:external-secrets:external-secrets",
                            "%s:aud": "sts.amazonaws.com"
                          }}
                        }]
                      }
                toFieldPath: spec.forProvider.assumeRolePolicy
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.esoRoleArn
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 3c. ESO inline RolePolicy ----------------------
          # Read-only Secrets Manager access scoped to the platform's ASM
          # path k8-platform/* in THIS account+region — the same scope the
          # hub ESO policy grants (terraform/management/irsa.tf
          # aws_iam_policy.eso); spokes never get write (PushSecret runs on
          # the hub only). Inline RolePolicy because the crossplane IRSA
          # has iam:PutRolePolicy, NOT iam:CreatePolicy (auto-008 C4).
          - name: eso-policy
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicy
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-eso-policy
              spec:
                forProvider: {}
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-eso"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-%s-eso"
              # ASM read scoped to <region>:<accountId>:secret:k8-platform/*.
              # region rides the environment (top-level patch above) so it
              # can join accountId in one combine.
              - type: CombineFromEnvironment
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: region
                    - fromFieldPath: accountId
                  strategy: string
                  string:
                    fmt: |
                      {
                        "Version": "2012-10-17",
                        "Statement": [{
                          "Effect": "Allow",
                          "Action": [
                            "secretsmanager:GetSecretValue",
                            "secretsmanager:DescribeSecret",
                            "secretsmanager:ListSecretVersionIds"
                          ],
                          "Resource": "arn:aws:secretsmanager:%s:%s:secret:k8-platform/*"
                        }]
                      }
                toFieldPath: spec.forProvider.policy


          # ---------- 3d. EBS CSI driver IRSA Role -------------------
          # OI-2026-06-11-3 / kp-2al.4: a spoke shipped no CSI driver and
          # no default StorageClass, so every observability PVC
          # (prometheus, alertmanager, loki) stayed Pending forever.
          # The durable fix is the managed aws-ebs-csi-driver EKS addon
          # (3f) running under IRSA — this Role — plus the default gp3
          # StorageClass delivered by the `storage` ApplicationSet
          # (argocd/apps/spoke/storage.yaml).
          #
          # Same trust shape as external-dns/ESO above (StringEquals on
          # BOTH :sub and :aud — auto-008 S2, never StringLike), assembled
          # from the environment (accountId + oidcHost) so no account-
          # ephemeral literal is committed. The subject is NOT ours to
          # choose: the EKS addon creates its own service account
          # kube-system/ebs-csi-controller-sa, so that exact :sub is what
          # AssumeRoleWithWebIdentity presents.
          - name: ebs-csi-role
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: Role
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-ebs-csi-role
              spec:
                forProvider:
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: XSpokeAccess
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-%s-ebs-csi"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.tags.ClusterName
              # Required: never create an IAM Role with an empty trust
              # policy — wait for the observed issuer (same as 2 / 3b).
              - type: CombineFromEnvironment
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: accountId
                    - fromFieldPath: oidcHost
                    - fromFieldPath: oidcHost
                    - fromFieldPath: oidcHost
                  strategy: string
                  string:
                    fmt: |
                      {
                        "Version": "2012-10-17",
                        "Statement": [{
                          "Effect": "Allow",
                          "Principal": {"Federated": "arn:aws:iam::%s:oidc-provider/%s"},
                          "Action": "sts:AssumeRoleWithWebIdentity",
                          "Condition": {"StringEquals": {
                            "%s:sub": "system:serviceaccount:kube-system:ebs-csi-controller-sa",
                            "%s:aud": "sts.amazonaws.com"
                          }}
                        }]
                      }
                toFieldPath: spec.forProvider.assumeRolePolicy
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.arn
                toFieldPath: status.ebsCsiRoleArn
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.arn

          # ---------- 3e. EBS CSI managed-policy attachment ----------
          # AmazonEBSCSIDriverPolicy is an AWS-MANAGED policy, so this is
          # a RolePolicyAttachment (iam:AttachRolePolicy — granted by the
          # IAMRoles Sid in terraform/management/irsa.tf, scoped to
          # role/k8-platform-*), following the platform-cluster
          # node-worker/cni/ecr precedent. The inline-RolePolicy idiom
          # used by external-dns/ESO above exists only because THOSE need
          # CUSTOM documents and the crossplane IRSA lacks
          # iam:CreatePolicy; there is no custom document to author here.
          - name: ebs-csi-policy-attachment
            base:
              apiVersion: iam.aws.m.upbound.io/v1beta1
              kind: RolePolicyAttachment
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-ebs-csi-policy-attachment
              spec:
                forProvider:
                  policyArn: arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "k8-platform-%s-ebs-csi"

          # ---------- 3f. aws-ebs-csi-driver EKS Addon ---------------
          # The managed addon installs ebs.csi.aws.com on the SPOKE (the
          # spoke's kube-system), which is what actually provisions the
          # EBS volumes the gp3 StorageClass names. serviceAccountRoleArn
          # is the Role above, patched Required: an addon created before
          # the ARN resolves would run with the node role's permissions
          # and fail CreateVolume with AccessDenied — i.e. the same
          # Pending PVCs this bead fixes, but silently.
          # resolveConflictsOnCreate OVERWRITE lets the managed addon
          # adopt any pre-existing self-managed driver objects (same
          # reasoning as the hub's vpc-cni addon, terraform eks.tf).
          - name: ebs-csi-addon
            base:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: Addon
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-ebs-csi-addon
              spec:
                forProvider:
                  region: us-east-1
                  addonName: aws-ebs-csi-driver
                  resolveConflictsOnCreate: OVERWRITE
                  resolveConflictsOnUpdate: OVERWRITE
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: XSpokeAccess
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.clusterName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.tags.ClusterName
              - type: FromCompositeFieldPath
                fromFieldPath: status.ebsCsiRoleArn
                toFieldPath: spec.forProvider.serviceAccountRoleArn
                policy:
                  fromFieldPath: Required
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 4. EKS AccessEntry ----------------------------
          # Maps the management cluster's ${clusterName}-argocd IAM role
          # (FULL ARN from the EnvironmentConfig argocdRoleArn) onto the
          # SPOKE cluster (spec.clusterName), so the ArgoCD application-
          # controller can authenticate to it (auto-008 §3 / reviewer F5).
          - name: access-entry
            base:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: AccessEntry
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-access-entry
              spec:
                forProvider:
                  region: us-east-1
                  type: STANDARD
                  tags:
                    ManagedBy: crossplane
                    PlatformAbstraction: XSpokeAccess
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.clusterName
              - type: FromEnvironmentFieldPath
                fromFieldPath: argocdRoleArn
                toFieldPath: spec.forProvider.principalArn
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.accessEntryArn
                toFieldPath: status.accessEntryArn
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 5. EKS AccessPolicyAssociation ----------------
          # Associates AmazonEKSClusterAdminPolicy (cluster-scoped) with
          # the argocd principal on the spoke. Defensible only paired with
          # the platform-spoke AppProject lockdown (auto-008 S1).
          - name: access-policy-association
            base:
              apiVersion: eks.aws.m.upbound.io/v1beta1
              kind: AccessPolicyAssociation
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-access-policy-association
              spec:
                forProvider:
                  region: us-east-1
                  policyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
                  accessScope:
                    type: cluster
                managementPolicies: [Observe, Create, Update, Delete]
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.region
              - type: FromCompositeFieldPath
                fromFieldPath: spec.clusterName
                toFieldPath: spec.forProvider.clusterName
              - type: FromEnvironmentFieldPath
                fromFieldPath: argocdRoleArn
                toFieldPath: spec.forProvider.principalArn
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"

          # ---------- 6. ArgoCD spoke registration Secret ------------
          # The durable producer half of the ADR-0010 cluster-facts
          # contract (OI-2026-06-07-1): the cluster Secret is ArgoCD's
          # connection credential AND the platform's fact bus. Writer of
          # record = THIS Object (provider-kubernetes pod SA, RBAC in
          # clusters/platform/01-provider-kubernetes-rbac.yaml);
          # the REST/kubectl registration path is retired.
          #
          # COMPLETE-OR-ABSENT: every patch into the manifest carries
          # policy.fromFieldPath: Required. Under the pinned
          # function-patch-and-transform v0.10.6, a Required patch that
          # cannot resolve skips creating this one composed resource and
          # leaves the siblings untouched — so the Secret only ever
          # appears fully assembled (labels, six contract annotations,
          # server, config), never partially (ADR-0010 consequence (b)).
          #
          # The contract keys here are gated bidirectionally against the
          # consumer ApplicationSets by
          # tests/unit/test_cluster_facts_contract.sh.
          - name: spoke-cluster-secret
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              metadata:
                labels:
                  platform.k8-platform.io/role: spoke-cluster-secret
              spec:
                managementPolicies: [Observe, Create, Update, Delete]
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      namespace: argocd
                      labels:
                        # ArgoCD only treats a Secret as a cluster when
                        # this label is present; the ApplicationSet
                        # cluster generators additionally require the
                        # k8-platform.io selector labels below. All ride
                        # the complete-or-absent guarantee above.
                        argocd.argoproj.io/secret-type: cluster
                        k8-platform.io/cluster-role: spoke
                    type: Opaque
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: hub
            patches:
              # Registration name <subdomain>-spoke (platform-spoke,
              # workload1-spoke) — matches the platform-spoke AppProject
              # destination allowlist (platform-spoke / *-spoke) and the
              # consumer templates' destination.name {{.name}}.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.subdomain
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-spoke"
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.subdomain
                toFieldPath: spec.forProvider.manifest.stringData.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-spoke"
                policy:
                  fromFieldPath: Required
              # Selector label (ADR-0010): consumer ApplicationSets derive
              # generated app names + per-cluster values files from it.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.shortName
                toFieldPath: spec.forProvider.manifest.metadata.labels[k8-platform.io/short-name]
                policy:
                  fromFieldPath: Required
              # ---- the six-fact contract annotations ----
              - type: FromEnvironmentFieldPath
                fromFieldPath: domain
                toFieldPath: spec.forProvider.manifest.metadata.annotations[k8-platform.io/domain]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.subdomain
                toFieldPath: spec.forProvider.manifest.metadata.annotations[k8-platform.io/subdomain]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.manifest.metadata.annotations[k8-platform.io/region]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: status.clusterCertificateArn
                toFieldPath: spec.forProvider.manifest.metadata.annotations[k8-platform.io/certificate-arn]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: status.externalDnsRoleArn
                toFieldPath: spec.forProvider.manifest.metadata.annotations[k8-platform.io/external-dns-role-arn]
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: status.esoRoleArn
                toFieldPath: spec.forProvider.manifest.metadata.annotations[k8-platform.io/eso-role-arn]
                policy:
                  fromFieldPath: Required
              # ---- the ArgoCD connection fields ----
              - type: FromCompositeFieldPath
                fromFieldPath: status.clusterEndpoint
                toFieldPath: spec.forProvider.manifest.stringData.server
                policy:
                  fromFieldPath: Required
              # awsAuthConfig.clusterName = spec.clusterName — the SAME
              # value the AccessEntry grants on, so a wrong-cluster fact
              # read cannot authenticate (fail-closed at auth). The hub
              # app-controller signs with its IRSA role; caData verifies
              # the spoke's real CA.
              - type: CombineFromComposite
                policy:
                  fromFieldPath: Required
                combine:
                  variables:
                    - fromFieldPath: spec.clusterName
                    - fromFieldPath: status.clusterCaData
                  strategy: string
                  string:
                    fmt: '{"awsAuthConfig":{"clusterName":"%s"},"tlsClientConfig":{"caData":"%s"}}'
                toFieldPath: spec.forProvider.manifest.stringData.config
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"
