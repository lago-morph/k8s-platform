# Coverage registry — the ONE hand-maintained coverage artifact (FINAL-PLAN §4.5).
#
# The expected-coverage SET is generated (tests/coverage/expected-coverage.txt,
# regenerated by derive-coverage.sh). This registry is the human-owned mapping
# of WHICH TEST defends WHICH composed-MR kind, plus its lane and cost tier.
#
# Invariants enforced by tests/unit/test_coverage_deriver.sh:
#   - ENFORCE: every derived group/kind (from the Compositions) MUST appear here
#     (an un-registered kind is CI-red — you added an MR with no coverage entry).
#   - ENFORCE: every registry key MUST be a real derived kind (no stale entries).
#   - WARN (until P2/P4 behavioral tests land): a kind whose `defended_by` is a
#     `pending:*` marker prints a WARN but does not fail — the behavioral test
#     that closes it ships in the named phase. When all are real test IDs, the
#     defended_by check becomes a hard gate (DevX C2).
#
# auto-014: all 13 previously-`pending:P*` kinds now have a real read-only
# "after"-tier behavioral check (one per kind). Each is its kind's ADR-0006
# oracle: it selects the REAL cloud resource the Crossplane abstraction produced
# by the Composition's own stamp (the provider tag `crossplane-kind=<kind>` /
# `PlatformAbstraction`), proves it healthy, and is read-only (safe in full +
# verify-only). Kinds NOT yet provisioned in a given account SKIP cleanly (the
# orchestrator promotes a SKIP to a FAIL iff the kind is expect-full). The P4/P5
# instantiate + negative tiers remain the create-and-verify / guard-fired gates.
#
# Fields per entry:
#   lane:        aws | non-aws   (non-aws kinds have no IAM action to simulate)
#   cost:        hermetic | singleton-coupled | slow
#                 - hermetic:           cheap, instantiate-and-verify (both full+verify paths)
#                 - singleton-coupled:  cheap action but coupled to a singleton (zone/spoke);
#                                       after-the-fact on the hub, instantiate only in isolation
#                 - slow:               EKS ~20 min / RDS multi-min — AFTER-THE-FACT only
#   defended_by: a test ID / path, or `pending:P<n>` until that phase's test lands
#   coverage:    (optional) `transitive` — this kind has NO standalone check and
#                emits NO `COVERS` line of its own: the check named in
#                `defended_by` proves it through assertions that cannot hold
#                unless this kind is real. Such a kind is excluded from the live
#                suite's EXPECT-FULL set (`derive-coverage.sh --expect-full`),
#                because runtime coverage is counted from COVERS lines and a kind
#                with no check of its own would otherwise read "declared but
#                unverified" on every run (kp-2al.20, build6-2220). It is not a
#                hole: the defending check's OWN kind stays in EXPECT-FULL, so
#                the violation fires there if that check stops passing. Invariant
#                (tests/unit/test_coverage_deriver.sh): a `transitive` kind's
#                defended_by MUST also defend a non-transitive kind.
#
# Cost assignments are policy knobs (FINAL-PLAN §5/§14.5); tune in the handoff.

kinds:
  acm.aws.m.upbound.io/Certificate:
    lane: aws
    cost: slow            # DNS-validated issuance is slow + singleton (one zone)
    defended_by: tests/live/checks/after/acm-certificate-live.sh
  acm.aws.m.upbound.io/CertificateValidation:
    lane: aws
    cost: slow
    defended_by: tests/live/checks/after/acm-certificate-validation-live.sh
  ec2.aws.m.upbound.io/SecurityGroup:
    lane: aws
    cost: singleton-coupled   # the dedicated <xr>-rds group (OI-2026-06-11-1); created with the XDatabase
    coverage: transitive      # no standalone check; proven by the RDS instance's placement assertion
    defended_by: tests/live/checks/after/rds-instance-live.sh   # behavioral: instance available IN a non-default VPC (placement = the SubnetGroup+SG in effect)
  ec2.aws.m.upbound.io/SecurityGroupRule:
    lane: aws
    cost: singleton-coupled   # admits the shared SSM relay to the cluster API; created with the cluster (docs/decisions/0008)
    defended_by: tests/live/checks/after/sandbox-kubectl-relay.sh   # behavioral: real kubectl through the relay (ADR-0006)
  eks.aws.m.upbound.io/Cluster:
    lane: aws
    cost: slow            # ~20 min — never recreate (FINAL-PLAN §5)
    defended_by: tests/live/checks/after/eks-cluster-live.sh
  eks.aws.m.upbound.io/NodeGroup:
    lane: aws
    cost: slow
    defended_by: tests/live/checks/after/eks-nodegroup-live.sh
  eks.aws.m.upbound.io/AccessEntry:
    lane: aws
    cost: singleton-coupled   # coupled to the spoke cluster
    defended_by: tests/live/checks/after/eks-access-entry-live.sh
  eks.aws.m.upbound.io/AccessPolicyAssociation:
    lane: aws
    cost: singleton-coupled
    defended_by: tests/live/checks/after/eks-access-policy-association-live.sh
  eks.aws.m.upbound.io/Addon:
    lane: aws
    cost: singleton-coupled   # coupled to the spoke cluster (aws-ebs-csi-driver)
    defended_by: tests/live/checks/after/eks-addon-live.sh
  eks.aws.m.upbound.io/IdentityProviderConfig:
    lane: aws
    cost: singleton-coupled   # coupled to the spoke cluster + its Keycloak issuer (REQ-AUTH-07)
    defended_by: tests/live/checks/after/eks-identity-provider-config-live.sh
  iam.aws.m.upbound.io/Role:
    lane: aws
    cost: hermetic
    defended_by: tests/live/checks/after/iam-role-live.sh
  iam.aws.m.upbound.io/RolePolicy:
    lane: aws
    # auto-014-001 (decision brief, Round-2 final): NOT independently hermetic --
    # RolePolicy carries a mandatory spec.forProvider.role foreign-key and is never
    # a Crossplane object-graph root (always created inside a Composition that owns
    # the Role). Per-kind solo instantiation is structurally invalid; P4 must
    # instantiate the enclosing XR as the atomic unit. (iam Role stays hermetic --
    # it IS a valid standalone root.)
    cost: singleton-coupled
    defended_by: tests/live/checks/after/iam-role-policy-live.sh
  iam.aws.m.upbound.io/RolePolicyAttachment:
    lane: aws
    # auto-014-001 (decision brief): NOT hermetic -- attaches a SHARED AWS-managed
    # policy (e.g. AmazonEKSClusterPolicy); a per-run instantiate with a colliding
    # role external-name would mutate a live role's policy set. After-the-fact on
    # the hub; P4 instantiates only via the enclosing XR (foreign-key on the Role).
    cost: singleton-coupled
    defended_by: tests/live/checks/after/iam-role-policy-attachment-live.sh
  iam.aws.m.upbound.io/OpenIDConnectProvider:
    lane: aws
    cost: singleton-coupled   # one OIDC provider per spoke
    defended_by: tests/live/checks/after/iam-oidc-provider-live.sh
  rds.aws.m.upbound.io/Instance:
    lane: aws
    cost: slow            # multi-minute — AFTER-THE-FACT only
    defended_by: tests/live/checks/after/rds-instance-live.sh
  rds.aws.m.upbound.io/SubnetGroup:
    lane: aws
    cost: singleton-coupled   # base-VPC private-subnet group (OI-2026-06-11-1); created with the XDatabase
    coverage: transitive      # no standalone check; the instance's DBSubnetGroup.VpcId read IS this group
    defended_by: tests/live/checks/after/rds-instance-live.sh   # behavioral: instance available IN a non-default VPC
  route53.aws.m.upbound.io/Record:
    lane: aws
    cost: singleton-coupled   # coupled to the singleton hosted zone
    defended_by: tests/live/checks/after/route53-record-live.sh
  secretsmanager.aws.m.upbound.io/Secret:
    lane: aws
    cost: hermetic
    defended_by: tests/live/checks/after/secretsmanager-secret-live.sh
  secretsmanager.aws.m.upbound.io/SecretVersion:
    lane: aws
    cost: singleton-coupled   # platform-secret material chain (writes the generated value into the MR-owned ASM container)
    coverage: transitive      # no standalone check; an AWSCURRENT stage exists only because this MR wrote it
    defended_by: tests/live/checks/after/secretsmanager-secret-live.sh   # behavioral: the written value IS the AWSCURRENT version the check requires
  generators.external-secrets.io/Password:
    lane: non-aws
    cost: singleton-coupled   # platform-secret material source (ADR-0005 generatorRef)
    coverage: transitive      # no standalone check; the material chain has no other source of the staged value
    defended_by: tests/live/checks/after/secretsmanager-secret-live.sh   # behavioral: generated material lands as the AWSCURRENT version
  external-secrets.io/ExternalSecret:
    lane: non-aws         # no IAM action to simulate (FINAL-PLAN §4.5)
    # auto-014-001 (decision brief): NOT hermetic -- ESO continuously reconciles
    # every live ExternalSecret through the cluster-wide ClusterSecretStore
    # singleton (shared IRSA identity + AWS API quota); per-run instances contend
    # on it. After-the-fact via live PlatformSecret claims; P4 does not instantiate
    # standalone ExternalSecrets. (The ClusterSecretStore is a bring-up precondition.)
    cost: singleton-coupled
    defended_by: tests/live/checks/after/external-secret-live.sh
  kubernetes.m.crossplane.io/Object:
    lane: non-aws         # kube-object reads/writes on the hub; no IAM action to simulate
    # ADR-0010 PR-2: the xspokeaccess Composition's cluster-facts Observe
    # Object + the spoke-cluster-secret registration-Secret writer. Coupled
    # to the spoke singleton (the facts come from the one paired
    # XPlatformCluster); after-the-fact on the hub, never instantiated
    # per-run.
    cost: singleton-coupled
    defended_by: tests/live/checks/after/spoke-cluster-secret-live.sh

# extra: side-effect resources absent from any Composition's resources[] (a
# controller-created NLB, an out-of-band-tagged subnet — blockers #9 and the LB).
# Each needs a `reason:`. Covered by the standing after-the-fact RGT-diff (§4.5);
# a stale `extra:` entry with no matching real resource for N runs is a FAIL.
# Populated in P2 alongside the resourcegroupstaggingapi diff oracle.
extra: []
