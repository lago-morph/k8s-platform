# XSpokeAccess — grants the hub ArgoCD + spoke add-ons their AWS access
# to the platform-services (spoke) cluster (auto-008 Round 2 §3) and, since
# ADR-0010 PR-2, produces the spoke's durable ArgoCD registration Secret.
#
# Provisioning this XR creates, on the HUB Crossplane
# (see crossplane/compositions/xspokeaccess.yaml):
#   - an OpenIDConnectProvider for the spoke's OIDC issuer (the IRSA anchor)
#   - the external-dns IRSA Role + inline Route53 RolePolicy
#   - an EKS AccessEntry + AccessPolicyAssociation mapping the
#     k8-platform-services-argocd role to AmazonEKSClusterAdminPolicy on
#     the spoke, so the ArgoCD application-controller can sync to it
#   - a cluster-facts Observe Object reading the PAIRED XPlatformCluster
#     XR (same metadata.name + namespace as this XR — the pairing is the
#     wiring, asserted by tests/unit/test_xspokeaccess.sh)
#   - the `platform-spoke` ArgoCD cluster Secret (argocd namespace),
#     carrying the ADR-0010 five-fact contract annotations the spoke
#     ApplicationSets template. Complete-or-absent: it appears only when
#     every cluster fact is observed.
#
# GATING (auto-008 C2): this XR consumes the cluster's *published* status
# (oidcIssuer, endpoint, clusterCaData, certificateArn) and is meaningless
# until those facts exist. It is sync-wave 20 (after the cluster claim at
# wave 10) and its ArgoCD Application (argocd/apps/spoke-access.yaml) is
# MANUAL-SYNC ONLY — sync is a deliberate operator action AFTER the four
# status facts are populated and the node group is Ready. Do NOT wait for
# `XPlatformCluster platform` to be Ready first: its composed EKS
# IdentityProviderConfig needs the Keycloak that this gate's registration
# unlocks, so Ready-before-spoke-access deadlocks a fresh build.
#
# NO OVERLAYS (ADR-0010 PR-2): the OIDC issuer, API endpoint, cluster CA
# and certificate ARN are account-ephemeral (AGENTS §8.1) and are OBSERVED
# from the cluster XR's status by the Composition's cluster-facts Object —
# never hand-patched. The former spec.oidcIssuer placeholder-overlay step
# is retired (SUBSTRATE-READINESS bans placeholder overlays); the strict
# XRD schema rejects the field outright. The account id, the
# k8-platform-services-argocd role ARN, the Route53 zone id and the domain
# come from the `cluster-network` EnvironmentConfig (NOT this file).
#
# WARNING: this Application is configured WITHOUT automated sync. See
# argocd/apps/spoke-access.yaml.
apiVersion: platform.k8-platform.io/v1alpha1
kind: XSpokeAccess
metadata:
  name: platform
  namespace: platform
  annotations:
    # Wave 20 — after the XPlatformCluster XR (wave 10). The cluster's
    # status facts must be populated (not: the XR Ready) before this XR
    # is synced; the wave + manual-sync Application together enforce it.
    argocd.argoproj.io/sync-wave: "20"
spec:
  clusterName: k8-platform-services
  subdomain: platform
  # ADR-0010 selector label value: the registration Secret carries
  # k8-platform.io/short-name=spoke; the consumer ApplicationSets generate
  # spoke-<addon> Applications from it.
  shortName: spoke
  region: us-east-1
