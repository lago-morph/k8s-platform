# Live behavioral suite — the EVIDENCE PRODUCER (FINAL-PLAN §4; burndown item 4).
# A dedicated workflow_dispatch (like chainsaw.yml is separate from
# terraform-test.yml). The logic lives in .github/scripts/live-verify-run.sh
# (so the wired/gating/scoped lint can assert it); this is the thin runner that
# checks out the repo, provides yq, runs the producer, and uploads the evidence.
name: Live verify

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "LIVE_PROFILE (full | verify-only)"
        required: false
        default: full
        type: choice
        options:
          - full
          - verify-only

concurrency:
  group: live-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The job creds assume the scoped verifier/reaper role (AWS-API checks, reaper,
  # mutex) AND, as the `live-cluster` profile, run the checks that declare
  # `# live-identity: cluster` (relay + Kubernetes access). See
  # .github/scripts/live-verify-run.sh (kp-2al.37).
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

jobs:
  live-verify:
    name: Live behavioral suite (full verdict, mutating, strict skips)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # kp-2al.36: the region is the AWS_REGION repository VARIABLE (a secret
      # would be masked as *** in every log line). Unset => fail here, loudly.
      - name: Require the AWS_REGION repository variable
        run: .github/scripts/require-aws-region.sh

      - name: Install yq (run.sh parses the skip-register)
        run: |
          set -euo pipefail
          sudo curl -fsSL \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install the Session Manager plugin (the relay tunnels ride SSM)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/ssm.deb" \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i "$RUNNER_TEMP/ssm.deb"
          session-manager-plugin --version
          for bin in aws kubectl jq; do command -v "$bin" >/dev/null || { echo "missing $bin" >&2; exit 1; }; done

      - name: Run live suite + emit evidence
        id: live
        env:
          LIVE_PROFILE: ${{ inputs.profile || 'full' }}
          EVIDENCE_DIR: ${{ runner.temp }}/live-evidence
        run: bash .github/scripts/live-verify-run.sh

      - name: Upload live-evidence
        if: steps.live.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence
          path: ${{ runner.temp }}/live-evidence/live-evidence.json
          retention-days: 90
