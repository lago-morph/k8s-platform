# Ops box — create, plan or destroy the machine a person drives a bring-up
# from (bead kp-2al.34).
#
# WHY THIS IS ITS OWN WORKFLOW rather than a phase of terraform-test.yml: the
# ops box is not part of the platform. It has no dependency on base or
# management, lives in the DEFAULT VPC so it predates the platform and survives
# a teardown, and is destroyed on its own schedule. Folding it into the
# platform's build workflow would tie operator tooling to platform phases that
# have nothing to do with it.
#
# WHY IT EXISTS AT ALL: the operator's laptop carries unrelated work
# credentials and must stay completely separate from this project. The box runs
# under an IAM instance profile, so this project's credentials are issued by AWS
# to the instance and never exist as a file on any machine the operator
# touches. It is reached through Session Manager in the AWS console — a browser
# shell — so there is no local aws CLI, no access key and no kubeconfig.
name: Ops box

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do with the ops box"
        required: true
        default: apply
        type: choice
        options:
          - plan
          - apply
          - verify
          - destroy

concurrency:
  group: opsbox-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}

jobs:
  opsbox:
    name: Ops box (${{ inputs.action }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      # The state backend. This is the MINIMUM that makes remote state work,
      # deliberately not a second copy of terraform-test.yml's bootstrap step —
      # that one owns versioning, encryption and the richer checks, and remains
      # the authority. The ONLY thing that must agree between the two is the
      # naming convention below, which tests/unit/test_opsbox_bringup.sh pins.
      #
      # Creating the ops box therefore bootstraps the backend if nothing else
      # has yet. That is a real consequence for a fresh account: afterwards the
      # credential probe's state-backend checks pass. The bring-up page says so.
      - name: State backend
        id: backend
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          BUCKET="k8-platform-tfstate-${ACCOUNT_ID}"
          TABLE="k8-platform-tfstate-lock"
          REGION="${AWS_DEFAULT_REGION}"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "creating $BUCKET"
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration "LocationConstraint=$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          else
            echo "$BUCKET already exists"
          fi

          if ! aws dynamodb describe-table --table-name "$TABLE" >/dev/null 2>&1; then
            echo "creating $TABLE"
            aws dynamodb create-table --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST >/dev/null
            aws dynamodb wait table-exists --table-name "$TABLE"
          else
            echo "$TABLE already exists"
          fi

          {
            echo "bucket=$BUCKET"
            echo "table=$TABLE"
            echo "region=$REGION"
          } >> "$GITHUB_OUTPUT"

      - name: terraform init
        working-directory: terraform/opsbox
        run: |
          set -o pipefail
          terraform init \
            -backend-config="bucket=${{ steps.backend.outputs.bucket }}" \
            -backend-config="key=k8-platform/opsbox/terraform.tfstate" \
            -backend-config="region=${{ steps.backend.outputs.region }}" \
            -backend-config="dynamodb_table=${{ steps.backend.outputs.table }}"

      # The box checks out whatever ref this workflow was dispatched from, so
      # exercising the scripts on a branch needs no extra input.
      - name: terraform plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: terraform/opsbox
        env:
          TF_VAR_repo_ref: ${{ github.ref_name }}
        run: terraform plan -no-color -out=opsbox.tfplan

      - name: terraform apply
        if: inputs.action == 'apply'
        working-directory: terraform/opsbox
        env:
          TF_VAR_repo_ref: ${{ github.ref_name }}
        run: terraform apply -auto-approve -no-color opsbox.tfplan

      - name: terraform destroy
        if: inputs.action == 'destroy'
        working-directory: terraform/opsbox
        env:
          TF_VAR_repo_ref: ${{ github.ref_name }}
        run: terraform destroy -auto-approve -no-color

      # Self-test. Runs k8p-status.sh ON THE BOX via SSM and prints its output
      # here, which proves in one shot that user_data cloned the repo and
      # installed the toolchain, that the SSM agent registered (so the console
      # browser shell will work), and that the script's AWS read paths behave.
      #
      # k8p-status.sh exits non-zero until every stage is green, which is the
      # CORRECT answer on an empty account — so this step reports the output
      # and does not fail the run on it. Read the lines, not the colour.
      - name: verify the box
        if: inputs.action == 'apply' || inputs.action == 'verify'
        working-directory: terraform/opsbox
        run: |
          set -euo pipefail
          ID="$(terraform output -raw instance_id)"
          echo "instance: $ID"

          echo "waiting for the SSM agent to register (user_data installs the toolchain first)"
          for i in $(seq 1 40); do
            ONLINE="$(aws ssm describe-instance-information               --filters "Key=InstanceIds,Values=$ID"               --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)"
            [ "$ONLINE" = "Online" ] && break
            sleep 15
          done
          [ "$ONLINE" = "Online" ] || { echo "SSM agent never came Online — the browser shell will not work"; exit 1; }
          echo "SSM agent Online"

          CMD="$(aws ssm send-command --instance-ids "$ID"             --document-name AWS-RunShellScript             --comment "opsbox self-test"             --parameters 'commands=["test -f /var/lib/opsbox-ready || { echo BOOTSTRAP-INCOMPLETE; tail -40 /var/log/opsbox-bootstrap.log; exit 1; }","cd /opt/k8-platform && git rev-parse --short HEAD","for t in aws kubectl jq yq helm; do echo $t $(command -v $t || echo MISSING); done","NO_COLOR=1 /opt/k8-platform/scripts/opsbox/k8p-status.sh || true"]' \
            --query 'Command.CommandId' --output text)"

          aws ssm wait command-executed --command-id "$CMD" --instance-id "$ID" 2>/dev/null || true

          echo "─────────────── output from the ops box ───────────────"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID"             --query 'StandardOutputContent' --output text
          echo "─────────────── stderr ────────────────────────────────"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID"             --query 'StandardErrorContent' --output text
          echo "───────────────────────────────────────────────────────"

          STATUS="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID"             --query 'Status' --output text)"
          echo "SSM command status: $STATUS"
          [ "$STATUS" = "Success" ] || { echo "the box did not complete the self-test"; exit 1; }

      - name: How to reach it
        if: inputs.action == 'apply'
        working-directory: terraform/opsbox
        run: |
          set -euo pipefail
          echo "─────────────────────────────────────────────────────────────"
          echo "Open this in the AWS console — it is a browser shell, so you"
          echo "need no local tools and no credentials on your machine:"
          echo
          terraform output -raw console_url
          echo
          echo
          echo "Then run:   k8p-status.sh     (where is the platform?)"
          echo "            k8p-bringup.sh    (drive a bring-up to green)"
          echo "────────────────────────────────────────────────────────────"
