# ArgoCD Application — syncs clusters/platform/spoke-access/ (the
# XSpokeAccess XR that grants the hub + spoke add-ons AWS access to the
# platform-services spoke cluster; auto-008 Round 2 §3).
#
# This Application is intentionally configured WITHOUT automated sync —
# no syncPolicy.automated block, manual sync only:
#
#   - Syncing the XSpokeAccess XR makes Crossplane create REAL AWS
#     resources (an OIDC provider, an IAM role/policy, EKS access
#     entries).
#   - The XR is GATED on the platform cluster's PUBLISHED FACTS (auto-008
#     C2, ADR-0010): its Composition observes status.oidcIssuer / endpoint
#     / clusterCaData / certificateArn from the XPlatformCluster XR. Auto-
#     sync would race the cluster provision and observe empty facts.
#
# So sync is a deliberate operator action via the ArgoCD UI or
# `argocd app sync spoke-access`, AFTER those four status fields are
# populated and the node group is Ready. Do NOT wait for the
# XPlatformCluster XR itself to be Ready first: its composed EKS
# IdentityProviderConfig validates the Keycloak issuer, and Keycloak only
# deploys after THIS gate registers the spoke, so Ready-before-spoke-access
# deadlocks a fresh build (retro 2026-07-06-255). Mirrors the manual-sync
# posture of platform-cluster-claim.yaml.
#
# A separate Application (not folded into platform-cluster-claim, whose
# directory.include is a fixed allowlist) keeps the spoke-access gate
# independent of the cluster claim's sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-access
  namespace: argocd
  annotations:
    # Wave 20 — after platform-cluster-claim (wave 10). The cluster's
    # status facts must be published (not: the XR Ready) before this
    # Application's XSpokeAccess XR is synced — see the header.
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: k8-platform
  source:
    repoURL: https://github.com/lago-morph/k8-platform.git
    targetRevision: main
    path: clusters/platform/spoke-access
  destination:
    server: https://kubernetes.default.svc
    # XSpokeAccess is a namespaced v2 XR living in the `platform`
    # namespace (created by clusters/platform/00-namespace.yaml, synced by
    # the platform-cluster-claim Application).
    namespace: platform
  # No syncPolicy.automated — manual sync only. See header.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
